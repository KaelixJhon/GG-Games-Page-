<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GG Games — Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="admin-page">
  <header class="topbar">
    <a class="logo" href="index.html">GG GAMES</a>
    <span class="admin-badge">ADMIN</span>
    <a class="text-link" href="index.html">← Volver</a>
  </header>

  <main class="admin-main">
    <section id="loginBox" class="panel narrow">
      <p class="eyebrow">PRIVATE AREA</p>
      <h1>ADMIN PANEL</h1>
      <p>Inicia sesión para administrar tus publicaciones.</p>
      <input id="email" type="email" placeholder="Correo">
      <input id="password" type="password" placeholder="Contraseña">
      <button id="loginBtn" class="gold-btn wide">ENTRAR</button>
      <p id="loginMsg" class="message"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="admin-heading">
        <div>
          <p class="eyebrow">CONTROL CENTER</p>
          <h1>PUBLICACIONES</h1>
        </div>
        <button id="logoutBtn" class="gray-btn">CERRAR SESIÓN</button>
      </div>

      <div class="panel">
        <h2 id="formTitle">NUEVO ADD-ON</h2>
        <form id="addonForm">
          <input type="hidden" id="addonId">
          <div class="form-grid">
            <label>Nombre<input id="name" required placeholder="Fire Sword V1.1"></label>
            <label>Categoría
              <select id="category">
                <option value="new">New Content</option>
                <option value="featured">Featured Add-ons</option>
              </select>
            </label>
          </div>
          <label>Descripción<textarea id="description" rows="4" placeholder="Describe el contenido..."></textarea></label>
          <div class="form-grid">
            <label>Imagen<input id="imageFile" type="file" accept="image/*"></label>
            <label>Archivo de descarga<input id="downloadFile" type="file" accept=".mcpack,.mcaddon,.mcworld,.zip,.jar,.rar"></label>
          </div>
          <div class="form-actions">
            <button class="gold-btn" type="submit">PUBLICAR / GUARDAR</button>
            <button id="cancelEdit" class="gray-btn hidden" type="button">CANCELAR</button>
          </div>
          <p id="formMsg" class="message"></p>
        </form>
      </div>

      <div class="panel">
        <h2>ENLACE DE DISCORD</h2>
        <p>Aparece abajo en la página principal. Déjalo vacío para ocultarlo.</p>
        <input id="discordUrl" type="url" placeholder="https://discord.gg/tuinvitacion">
        <div class="form-actions"><button id="saveDiscord" class="gold-btn" type="button">GUARDAR ENLACE</button></div>
        <p id="discordMsg" class="message"></p>
      </div>

      <div class="panel">
        <h2>TUS PUBLICACIONES</h2>
        <div id="adminList" class="admin-list"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
